<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Dices — Support</title>
  <link rel="stylesheet" href="../assets/style.css" />
  <script>
    var supported = ['de', 'en', 'es', 'fr', 'it', 'ja', 'pl', 'pt-br'];
    var lang = (navigator.language || 'en').toLowerCase();
    var match = supported.find(function (l) { return lang === l || lang.indexOf(l + '-') === 0; })
      || supported.find(function (l) { return lang.indexOf(l) === 0; });
    if (match) {
      window.location.replace(match + '/');
    }
  </script>
</head>
<body>
  <main>
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 24 24">
        <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="0.9">
          <polygon points="12,2 21,7 21,17 12,22 3,17 3,7"/>
          <line x1="12" y1="2" x2="12" y2="12"/>
          <line x1="21" y1="17" x2="12" y2="12"/>
          <line x1="3" y1="17" x2="12" y2="12"/>
        </g>
      </svg>
      <span>Dices</span>
    </div>
    <h1>Support</h1>
    <p>Choose your language:</p>
    <nav class="langs" style="border-bottom: none; padding-bottom: 0;">
      <a href="de/">Deutsch</a>
      <a href="en/">English</a>
      <a href="es/">Español</a>
      <a href="fr/">Français</a>
      <a href="it/">Italiano</a>
      <a href="ja/">日本語</a>
      <a href="pl/">Polski</a>
      <a href="pt-br/">Português (BR)</a>
    </nav>
  </main>
</body>
</html>
